<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Othmar Creative Studio — Creative Design & Digital Solutions</title>
    <meta
      name="description"
      content="We design and build digital experiences that move businesses forward. High-performing business websites, web applications, and cinematic digital experiences."
    />
    <meta name="theme-color" content="#101114" />

    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Othmar Creative Studio — Creative Design & Digital Solutions" />
    <meta
      property="og:description"
      content="We design and build digital experiences that move businesses forward. Custom web development, web apps, and cinematic digital solutions."
    />
    <meta property="og:site_name" content="Othmar Creative Studio" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Othmar Creative Studio — Creative Design & Digital Solutions" />
    <meta
      name="twitter:description"
      content="We design and build digital experiences that move businesses forward. Custom web development, web apps, and cinematic digital solutions."
    />

    <!-- Google Fonts: Outfit (Display) & Plus Jakarta Sans (Prose) & JetBrains Mono (Tabular) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Othmar Creative Studio",
        "tagline": "Creative Design & Digital Solutions",
        "description": "We design and build digital experiences that move businesses forward. From high-performing business websites to custom web applications and cinematic digital experiences.",
        "founder": {
          "@type": "Person",
          "name": "Othmar Philip",
          "jobTitle": "CEO & Creative Director"
        },
        "knowsAbout": [
          "Web Design and Development",
          "Web Application Development",
          "Cinematic Website Development",
          "UI/UX Design",
          "Brand Identity & Visual Design",
          "Portfolio Design & Media Kits"
        ]
      }
    </script>
  </head>
  <body class="bg-[#101114] text-[#F5F4EF] selection:bg-[#C6FF4D] selection:text-[#101114] antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
